<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trip with Joanna</title>
  <meta name="description" content="Kasper & Joanna's travel memories — 澳洲 Australia, 沖繩 Okinawa and 名古屋 Nagoya, one page per day." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,300&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <a class="skip-link" href="#main">跳到主要內容 Skip to content</a>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="#/"><span class="brand-mark" aria-hidden="true"></span>Trip with Joanna</a>
      <nav class="site-nav" aria-label="Trips" id="site-nav">
        <a href="#/" data-nav="home">首頁</a>
        <a href="#/australia" data-nav="australia">澳洲</a>
        <a href="#/okinawa" data-nav="okinawa">沖繩</a>
        <a href="#/nagoya" data-nav="nagoya">名古屋</a>
      </nav>
    </div>
  </header>

  <!-- Every view is rendered here by script.js from trips.js -->
  <main id="main" tabindex="-1"></main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <p class="sig">Kasper <span class="heart" aria-hidden="true">&#10084;</span><span class="visually-hidden">and</span> Joanna</p>
      <nav class="footer-nav" aria-label="Footer">
        <a href="#/">首頁</a><a href="#/australia">澳洲</a><a href="#/okinawa">沖繩</a><a href="#/nagoya">名古屋</a>
      </nav>
      <p>Our travel memories, one page at a time.</p>
    </div>
  </footer>

  <!-- Phone: day list opened from the "Day 3 of 11" button -->
  <dialog class="sheet" id="sheet" aria-labelledby="sheet-title">
    <div class="sheet-inner">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="sheet-head">
        <h2 id="sheet-title">Jump to</h2>
        <button class="sheet-close" type="button" aria-label="Close day list" data-sheet-close><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <nav class="rail in-sheet" aria-label="Trip pages" id="sheet-rail"></nav>
    </div>
  </dialog>

  <dialog class="lightbox" aria-label="Photo">
    <div class="lb-stage"><img alt=""></div>
    <p class="lb-caption"></p>
    <span class="lb-count" aria-hidden="true"></span>
    <button class="lb-btn lb-close" type="button" aria-label="Close" data-lb="close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <button class="lb-btn lb-prev" type="button" aria-label="Previous photo" data-lb="prev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
    <button class="lb-btn lb-next" type="button" aria-label="Next photo" data-lb="next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
  </dialog>

  <script src="trips.js"></script>
  <script src="script.js"></script>
</body>
</html>
